<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X-LangChain 智能助手</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- 侧边栏 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <div class="logo-icon">AI</div>
                    <span class="logo-text">智能助手</span>
                </div>
            </div>
            
            <nav class="sidebar-menu">
                <div class="menu-item active">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                    </svg>
                    <span>聊天</span>
                </div>
            </nav>
            
            <div class="sidebar-footer">
                <div class="user-profile">
                    <div class="user-avatar">U</div>
                    <div class="user-info">
                        <div class="user-name">用户</div>
                        <div class="user-status">
                            <span class="status-dot"></span>
                            <span>在线</span>
                        </div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- 主内容区 -->
        <main class="main-content">
            <!-- 头部 -->
            <header class="header">
                <h1 class="header-title">智能助手</h1>
                <div class="header-actions">
                    <button class="action-btn secondary" onclick="newConversation()">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: inline-block; vertical-align: middle; margin-right: 6px;">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                            <polyline points="14 2 14 8 20 8"></polyline>
                            <line x1="16" y1="13" x2="8" y2="13"></line>
                            <line x1="16" y1="17" x2="8" y2="17"></line>
                            <polyline points="10 9 9 9 8 9"></polyline>
                        </svg>
                        新建对话
                    </button>
                    <button class="action-btn primary" onclick="saveConversation()">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: inline-block; vertical-align: middle; margin-right: 6px;">
                            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                        </svg>
                        保存对话
                    </button>
                </div>
            </header>

            <!-- 特性卡片 -->
            <section class="features-section">
                <h2 class="features-title">快捷功能</h2>
                <div class="features-grid">
                    <div class="feature-card" onclick="quickAction('write')">
                        <div class="feature-icon">✍️</div>
                        <div class="feature-title">写文章</div>
                        <div class="feature-desc">帮您撰写高质量的文章内容</div>
                    </div>
                    <div class="feature-card" onclick="quickAction('code')">
                        <div class="feature-icon">💻</div>
                        <div class="feature-title">写代码</div>
                        <div class="feature-desc">快速生成代码片段</div>
                    </div>
                    <div class="feature-card" onclick="quickAction('sql')">
                        <div class="feature-icon">📊</div>
                        <div class="feature-title">SQL 查询</div>
                        <div class="feature-desc">自然语言转 SQL</div>
                    </div>
                    <div class="feature-card" onclick="quickAction('search')">
                        <div class="feature-icon">🔍</div>
                        <div class="feature-title">网络搜索</div>
                        <div class="feature-desc">实时信息查询</div>
                    </div>
                </div>
            </section>

            <!-- 聊天区域 -->
            <section class="chat-container">
                <div class="messages-container" id="messagesContainer">
                    <!-- 欢迎消息 -->
                    <div class="message-bubble bot-message">
                        <div class="avatar bot">🤖</div>
                        <div class="message-content">
                            <p>你好！我是你的智能助手，有什么可以帮你的吗？</p>
                        </div>
                    </div>
                </div>
            </section>

            <!-- 输入区域 -->
            <footer class="input-container">
                <div class="input-wrapper">
                    <textarea 
                        id="messageInput" 
                        placeholder="输入你的问题..." 
                        rows="1"
                        onkeydown="handleKeyDown(event)"
                    ></textarea>
                    <div class="input-actions">
                        <div class="action-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                                <polyline points="14 2 14 8 20 8"></polyline>
                            </svg>
                        </div>
                        <div class="action-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                            </svg>
                        </div>
                    </div>
                    <button class="send-btn" id="sendBtn" onclick="sendMessage()">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </div>
                <div class="input-hints">
                    <span>按 Enter 发送</span>
                    <span>·</span>
                    <span>Shift + Enter 换行</span>
                    <span>·</span>
                    <span>支持 Markdown 格式</span>
                </div>
            </footer>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
